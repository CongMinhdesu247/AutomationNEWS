name: personal-automation-hub
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - hub_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    environment: &api-environment
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HOST: 0.0.0.0
      PORT: 3001
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      NTFY_ALLOWED_ORIGINS: ${NTFY_ALLOWED_ORIGINS:-}
      DIGEST_TIMEOUT_MS: ${DIGEST_TIMEOUT_MS:-25000}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-6000}
      MAX_CONCURRENT_OPERATIONS: ${MAX_CONCURRENT_OPERATIONS:-2}
    command: ["pnpm", "--filter", "@hub/api", "migrate"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-6000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-15000}
      WORKER_HEARTBEAT_MS: ${WORKER_HEARTBEAT_MS:-4000}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-1000}
      WORKER_MAX_RECOVERIES: ${WORKER_MAX_RECOVERIES:-3}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-3}
      WORKER_RETRY_BASE_MS: ${WORKER_RETRY_BASE_MS:-1000}
      WORKER_RETRY_MAX_MS: ${WORKER_RETRY_MAX_MS:-60000}
      WORKER_SHUTDOWN_MS: ${WORKER_SHUTDOWN_MS:-10000}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s
    restart: unless-stopped
  scheduler:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: scheduler
    init: true
    environment:
      <<: *api-environment
      SCHEDULER_POLL_MS: ${SCHEDULER_POLL_MS:-5000}
      SCHEDULER_GRACE_MS: ${SCHEDULER_GRACE_MS:-900000}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 25s
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  hub_data:
