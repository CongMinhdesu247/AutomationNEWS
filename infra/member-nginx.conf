map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

geo $trusted_member_proxy {
  default        0;
  127.0.0.1/32   1;
  10.0.0.0/8     1;
  172.16.0.0/12  1;
  192.168.0.0/16 1;
}

map $http_x_forwarded_for $member_first_xff {
  "~^([^,\s]+)" $1;
  default       "";
}

map "$trusted_member_proxy|$http_cf_connecting_ip|$member_first_xff" $member_limit_key {
  "~^1\|([^|]+)\|" $1;
  "~^1\|\|(.+)$"   $1;
  default          $binary_remote_addr;
}

limit_req_zone $member_limit_key zone=member_api_limit:5m rate=5r/s;

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 64k;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header Cache-Control "no-store" always;
  include /etc/nginx/snippets/member-security-headers.conf;

  resolver 127.0.0.11 valid=5s ipv6=off;
  set $member_api api:3001;

  location = /api/member {
    limit_req zone=member_api_limit burst=10 nodelay;
    proxy_pass http://$member_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  # The phone-facing port must never expose owner settings or operations.
  location /api/ {
    default_type application/json;
    return 403 '{"error":{"code":"FORBIDDEN","message":"Cổng này chỉ dành cho liên kết thành viên gia đình.","issues":[]}}';
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/member-security-headers.conf;
    try_files $uri =404;
  }

  location = /health {
    return 200 'ok';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
