# Optional prebuilt-image override for offline/image-archive releases.
# Keep existing Compose project (automationnews), network, and volume (automationnews_hub_data).
services:
  api:
    image: automationnews-api:${AUTOMATIONNEWS_IMAGE_TAG:-latest}
  migrate:
    image: automationnews-api:${AUTOMATIONNEWS_IMAGE_TAG:-latest}
  worker:
    image: automationnews-worker:${AUTOMATIONNEWS_IMAGE_TAG:-latest}
  scheduler:
    image: automationnews-scheduler:${AUTOMATIONNEWS_IMAGE_TAG:-latest}
  web:
    image: automationnews-web:${AUTOMATIONNEWS_IMAGE_TAG:-latest}
