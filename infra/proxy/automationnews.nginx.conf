# Host Nginx reverse-proxy template for /home/congminh/apps/_proxy/sites/automationnews.nginx.conf
# Forwards public traffic to AutomationNEWS loopback container port 127.0.0.1:8091.

upstream automationnews_upstream {
    server 127.0.0.1:8091;
    keepalive 16;
}

server {
    listen 80;
    # Replace with your actual subdomain configured in APP_ORIGIN:
    server_name news.example.com;
    server_tokens off;
    client_max_body_size 256k;

    # Unbuffered Server-Sent Events (SSE) for live digest run progress
    location ~* ^/api/runs/[0-9a-f-]+/events$ {
        proxy_pass http://automationnews_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://automationnews_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }
}
