map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

geo $trusted_proxy {
  default        0;
  127.0.0.1/32   1;
  10.0.0.0/8     1;
  172.16.0.0/12  1;
  192.168.0.0/16 1;
}

map $http_x_forwarded_for $first_xff_ip {
  "~^([^,\s]+)" $1;
  default       "";
}

map "$trusted_proxy|$http_cf_connecting_ip|$first_xff_ip" $rate_limit_key {
  "~^1\|([^|]+)\|" $1;
  "~^1\|\|(.+)$"   $1;
  default          $binary_remote_addr;
}

limit_req_zone $rate_limit_key zone=hub_auth_limit:10m rate=10r/s;
limit_conn_zone $rate_limit_key zone=hub_sse_conn:10m;

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 256k;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    image/svg+xml
    application/manifest+json;

  add_header Cache-Control "no-store" always;
  include /etc/nginx/snippets/security-headers.conf;

  # Docker's embedded DNS: resolve again when API containers are recreated.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;
  set $api_upstream api:3001;

  location ~* ^/api/runs/[0-9a-f-]+/events$ {
    limit_conn hub_sse_conn 10;
    proxy_pass http://$api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    add_header X-Accel-Buffering "no" always;
    add_header Cache-Control "no-cache, no-store, no-transform" always;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /api/auth/ {
    limit_req zone=hub_auth_limit burst=20 nodelay;
    proxy_pass http://$api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  location /api/ {
    proxy_pass http://$api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  # Content-hashed bundles can be cached safely; missing chunks must return 404.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
