server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 256k;
  # Revalidate the entry page after deployments; old HTML references removed bundles.
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Docker's embedded DNS: resolve again when API containers are recreated.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;
  set $api_upstream api:3001;
  location ~ ^/api/runs/[0-9a-f-]+/events$ {
    proxy_pass http://$api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
  location /api/ {
    proxy_pass http://$api_upstream$request_uri;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
  }
  # Missing bundles must be 404, never the SPA HTML fallback (invalid JS/CSS MIME).
  location /assets/ { try_files $uri =404; }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
