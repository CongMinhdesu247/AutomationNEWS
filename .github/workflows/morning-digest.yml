name: Morning digest (PC off)

on:
  schedule:
    # 00:00 UTC = 07:00 Vietnam. GitHub may start scheduled jobs late.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and validate only; do not send or change cloud state"
        type: boolean
        default: true
      force_send:
        description: "Send again today intentionally (may duplicate a notification)"
        type: boolean
        default: false

permissions:
  contents: write # Only needed for the separate public star-count/delivery-state branch.

concurrency:
  group: morning-digest-cloud
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install pinned package manager and dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Typecheck backend and contracts
        run: |
          pnpm --filter @hub/contracts typecheck
          pnpm --filter @hub/api typecheck
      - name: Test cloud execution and notification layout
        run: pnpm exec vitest run apps/api/src/cloud/cloud.test.ts apps/api/src/notifications/format.test.ts apps/api/src/connectors/vietnamese.test.ts apps/api/src/connectors/fuel.test.ts
      - name: Collect and send morning digest
        env:
          HUB_SETTINGS_JSON: ${{ secrets.HUB_SETTINGS_JSON }}
          HUB_FUEL_ENABLED: "true"
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          HUB_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          HUB_FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send && 'true' || 'false' }}
        run: pnpm --filter @hub/api exec tsx src/cloud/main.ts
