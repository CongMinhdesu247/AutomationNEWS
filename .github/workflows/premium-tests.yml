name: Application fixture tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: accounts_test
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: accounts_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U accounts_test -d accounts_test" --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://accounts_test:fixture_only@127.0.0.1:5432/accounts_test
      GEMINI_API_KEY: ""
      NTFY_TOKEN: ""
      NEWS_FREE_ONLY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
