name: hub-accounts-test
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: accounts_test
      POSTGRES_PASSWORD: fixture_only
      POSTGRES_DB: accounts_test
    ports:
      - "127.0.0.1:54369:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U accounts_test -d accounts_test"]
      interval: 2s
      timeout: 2s
      retries: 20
