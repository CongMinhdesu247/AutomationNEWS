name: hub-step5-test
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: step5
      POSTGRES_PASSWORD: fixture_only
      POSTGRES_DB: step5
    ports:
      - "127.0.0.1:54349:5432"
    volumes:
      - step5_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U step5 -d step5"]
      interval: 2s
      timeout: 2s
      retries: 20
  api:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql://step5:fixture_only@db:5432/step5
    command:
      [
        "pnpm",
        "--filter",
        "@hub/api",
        "exec",
        "tsx",
        "src/telemetry/fixture-server.ts",
      ]
    volumes:
      - ./server.ts:/app/apps/api/src/telemetry/fixture-server.ts:ro
    ports:
      - "127.0.0.1:3002:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 20
  web:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
      target: web
    ports:
      - "127.0.0.1:8098:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  step5_data:
