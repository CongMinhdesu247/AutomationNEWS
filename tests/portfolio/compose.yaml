name: hub-step6-demo
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: step6
      POSTGRES_PASSWORD: fixture_only
      POSTGRES_DB: step6
    ports:
      - "127.0.0.1:${DEMO_DB_PORT:-54359}:5432"
    volumes:
      - step6_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U step6 -d step6"]
      interval: 2s
      timeout: 2s
      retries: 20
  api:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql://step6:fixture_only@db:5432/step6
      PORTFOLIO_FIXTURE: "1"
    command:
      [
        "pnpm",
        "--filter",
        "@hub/api",
        "exec",
        "tsx",
        "src/operations/portfolio-server.ts",
      ]
    ports:
      - "127.0.0.1:${DEMO_API_PORT:-3003}:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 20
  web:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
      target: web
      args:
        VITE_DEMO_MODE: "true"
    ports:
      - "127.0.0.1:${DEMO_WEB_PORT:-8099}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  step6_data:
